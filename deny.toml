# cargo-deny 配置：许可证与漏洞审计基线。
# 见 https://embarkstudios.github.io/cargo-deny/

[licenses]
# 与 Rust 地理生态兼容的许可证白名单。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # BSL-1.0（Boost）：clipboard-win / error-code（egui 栈经 arboard 链引入），宽松许可
    "BSL-1.0",
    # 字体许可：epaint_default_fonts（egui 内置字体，仅字体文件适用）
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[advisories]
# 拒绝引入带已知漏洞的依赖版本。
yanked = "deny"
# 「停止维护但无漏洞」豁免（替换依赖链成本远高于收益，复核后按需收敛）：
# - RUSTSEC-2024-0436 paste（经 zvariant 链引入；dtolnay 宣布停止维护，功能稳定）
# - RUSTSEC-2026-0192 ttf-parser（经 tiny-skia/ab_glyph 渲染链与 acadrust/nalgebra 引入）
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
]

[bans]
# 同一依赖的多个大版本给出警告（内核要求版本收敛）。
multiple-versions = "warn"
