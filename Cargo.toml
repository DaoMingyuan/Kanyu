# 堪舆 (Kanyu) —— AI 原生地理空间操作系统
# Workspace 根清单：所有 crate 共享依赖在此统一锁定版本，避免冗余。

[workspace]
resolver = "2"
members = [
    "crates/kanyu-core",
    "crates/kanyu-cli",
    "crates/kanyu-mcp",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["DaoMingyuan <345558033@qq.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DaoMingyuan/Kanyu"
homepage = "https://github.com/DaoMingyuan/Kanyu"
description = "Kanyu (堪舆): an AI-native geospatial operating system — GeoArrow memory model, MCP neural interface, self-evolving WASM genes."
keywords = ["gis", "geospatial", "geoarrow", "mcp", "ai"]
categories = ["science::geo", "visualization", "parser-implementations"]

# 共享依赖：版本只在根清单声明一次，子 crate 用 `workspace = true` 引用。
[workspace.dependencies]
kanyu-core = { path = "crates/kanyu-core", version = "0.3.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
csv = "1"
clap = { version = "4", features = ["derive", "cargo"] }
geojson = "0.24"
schemars = "0.8"
shapefile = "0.9"
# 本地文件读写无需 HTTP 能力，关闭默认的 http/reqwest 特性以控制依赖体积。
flatgeobuf = { version = "6", default-features = false }
# 与 flatgeobuf 内部依赖同版本锁定；仅为其开启 with-geojson 特性
#（flatgeobuf 自身以 default-features=false 引入 geozero，不含 geojson 模块）。
geozero = { version = "0.15.1", default-features = false, features = ["with-geojson"] }
# GeoParquet：geoparquet crate 负责 geo 元数据与 RecordBatch 编解码；
# arrow/parquet 版本须与 geoparquet 内部依赖同系列（58），类型才能互通。
geoparquet = "0.8"
geoarrow-schema = "0.8"
arrow-array = "58"
arrow-schema = "58"
arrow-select = "58"
parquet = { version = "58", features = ["arrow"] }
dxf = "0.6"
# KMZ（zip 容器）与 geo-types 转换本轮不需要，关闭默认特性保持依赖最小。
kml = { version = "0.14", default-features = false }
geo = "0.33"
# 与 geojson 0.24 / geo 0.33 内部依赖同 0.7 系统一（geojson 的 geo 互转以其类型为准）。
geo-types = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
