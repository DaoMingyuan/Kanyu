[package]
name = "kanyu-mcp"
description = "MCP (Model Context Protocol) neural interface for the Kanyu kernel — exposes all kernel capabilities as standard AI tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "kanyu_mcp"
path = "src/lib.rs"

[dependencies]
kanyu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
# rmcp 的 dep:hyper 仅带 client feature；服务端 accept 需自声明 server。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
